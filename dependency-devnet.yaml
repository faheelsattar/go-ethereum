participants:
  - el_type: geth
    el_image: geth-dependency:local
    el_force_restart: true
    el_log_level: info
    el_extra_params:
      - --miner.parallel-execution
      - --miner.parallel-workers=8

    cl_type: lighthouse
    count: 1

network_params:
  network: kurtosis
  genesis_delay: 20
  genesis_gaslimit: 60000000

additional_services:
  - dora
  - spamoor

spamoor_params:
  spammers:
    - scenario: eoatx
      name: independent-transfers
      config:
        throughput: 5
        max_wallets: 100
        random_target: true
